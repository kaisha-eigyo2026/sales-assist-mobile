<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-DUj7MpD9X6fuPmWeFHlmVm63wcIpa2Ybtiwx4tqH7eo='; style-src 'unsafe-inline'; connect-src https://api.github.com https://gist.githubusercontent.com; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1022">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="営業支援">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>営業支援</title>
<style>
/* 11/8 沢田さん「めちゃんこかっこよく」：上は紺の帯（白・ダーク共通）、下はアプリのタブ。白基調・ダーク基調を切りかえ */
:root {
  --bg: #f1f3f9; --surface: #ffffff; --surface-2: #f5f7fc; --sunk: #eef1f8;
  --line: rgba(15,23,42,.07); --line-strong: rgba(15,23,42,.13);
  --text: #0b1222; --text-2: #334155; --muted: #6b7489;
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 20px -6px rgba(30,41,82,.12);
  --shadow-lg: 0 18px 40px -16px rgba(49,46,129,.45);
  --a: #5b5bf6; --b: #12b5d6; --grad: linear-gradient(135deg, #5b5bf6 0%, #3b82f6 55%, #12b5d6 100%);
  --band: radial-gradient(120% 140% at 0% 0%, #2b2a8f 0%, #141b46 45%, #0b1022 100%);
  --tabbar: rgba(255,255,255,.82); --tab-line: rgba(15,23,42,.08);
  --good: #10b981; --warn: #f59e0b; --bad: #ef4444; --gold: #d97706;
  --k-appt: #f59e0b; --k-view: #10b981; --k-contract: #ec4899; --k-settle: #8b5cf6; --k-task: #0ea5e9; --k-other: #94a3b8; --k-todo: #5b5bf6;
  --t-now: #ef4444; --t-today: #f59e0b; --t-week: #3b82f6; --t-watch: #94a3b8; --t-out: #cbd5e1; --t-fresh: #10b981;
  --err-bg: #fef2f2; --err-tx: #b91c1c;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #06080d; --surface: #10131b; --surface-2: #161a24; --sunk: #0b0e15;
  --line: rgba(255,255,255,.06); --line-strong: rgba(255,255,255,.12);
  --text: #f3f5fa; --text-2: #c9cfdc; --muted: #8790a5;
  --shadow: 0 0 0 1px rgba(255,255,255,.05);
  --shadow-lg: 0 20px 50px -18px rgba(91,91,246,.55);
  --band: radial-gradient(120% 140% at 0% 0%, #26247a 0%, #0f1438 45%, #06080d 100%);
  --tabbar: rgba(14,17,25,.78); --tab-line: rgba(255,255,255,.07);
  --t-out: #475569; --gold: #fbbf24;
  --err-bg: rgba(239,68,68,.12); --err-tx: #fecaca;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #06080d; --surface: #10131b; --surface-2: #161a24; --sunk: #0b0e15;
    --line: rgba(255,255,255,.06); --line-strong: rgba(255,255,255,.12);
    --text: #f3f5fa; --text-2: #c9cfdc; --muted: #8790a5;
    --shadow: 0 0 0 1px rgba(255,255,255,.05);
    --shadow-lg: 0 20px 50px -18px rgba(91,91,246,.55);
    --band: radial-gradient(120% 140% at 0% 0%, #26247a 0%, #0f1438 45%, #06080d 100%);
    --tabbar: rgba(14,17,25,.78); --tab-line: rgba(255,255,255,.07);
    --t-out: #475569; --gold: #fbbf24;
    --err-bg: rgba(239,68,68,.12); --err-tx: #fecaca;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
html, body { margin: 0; color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; background: var(--bg); transition: background .25s; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
#app { min-height: 100vh; }

/* ---- 上の帯 ---- */
.band { position: sticky; top: 0; z-index: 10; color: #fff; background: var(--band); padding: calc(env(safe-area-inset-top) + 10px) 20px 18px; box-shadow: 0 10px 30px -18px rgba(0,0,0,.6); overflow: hidden; }
.band::after { content: ""; position: absolute; right: -60px; top: -80px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(18,181,214,.35), transparent 65%); pointer-events: none; }
.band-row { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; max-width: 640px; margin: 0 auto; }
.band small { display: block; font-size: 12px; letter-spacing: .02em; color: rgba(255,255,255,.62); font-weight: 500; }
.band small.old { color: #fcd34d; }
.band h1 { margin: 2px 0 0; font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -.01em; }
.hb { display: flex; gap: 8px; }
.hbtn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 14px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.08); color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: transform .15s, background .15s; }
.hbtn:active { transform: scale(.92); background: rgba(255,255,255,.16); }
.hbtn:disabled .i { animation: spin 1s linear infinite; }
.hbtn svg.i { width: 20px; height: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }

main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); animation: rise .28s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---- 下のタブ ---- */
nav.tabbar { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--tabbar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--tab-line); }
nav.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 2px; border: 0; background: none; color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: .02em; transition: color .15s; }
nav.tabbar button .ic { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; transition: background .2s, transform .2s; }
nav.tabbar button.on { color: var(--a); }
nav.tabbar button.on .ic { background: color-mix(in srgb, var(--a) 14%, transparent); transform: translateY(-1px); }
nav.tabbar button:active .ic { transform: scale(.9); }
nav.tabbar .badge { position: absolute; margin: -6px 0 0 22px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; line-height: 16px; text-align: center; }
nav.tabbar .ic { position: relative; }

/* ---- 共通 ---- */
section { margin-top: 22px; }
section:first-child { margin-top: 4px; }
h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 4px 10px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
h2 em { font-style: normal; font-weight: 600; font-size: 12.5px; color: var(--muted); margin-left: auto; }
h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--t-watch); align-self: center; }
h2.fresh .dot { background: var(--t-fresh); } h2.now .dot { background: var(--t-now); } h2.today .dot { background: var(--t-today); }
h2.week .dot { background: var(--t-week); } h2.rank .dot { background: var(--b); } h2.plain .dot { display: none; }
.empty { margin: 36px 0; text-align: center; color: var(--muted); font-size: 14px; }
.empty .i { display: block; margin: 0 auto 8px; width: 34px; height: 34px; opacity: .45; }
.empty.sm { margin: 4px 0 8px; padding: 18px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); font-size: 13.5px; }
.err { margin: 12px 0; padding: 12px 14px; border-radius: 14px; background: var(--err-bg); color: var(--err-tx); font-size: 13.5px; }
.note { font-size: 12px; color: var(--muted); margin: 12px 4px; line-height: 1.6; }
footer { margin: 34px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); text-align: center; }
.link { border: 0; background: none; color: var(--a); font-size: 12.5px; font-weight: 600; padding: 6px; }
.b { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.b.fresh { color: var(--good); background: color-mix(in srgb, var(--good) 13%, transparent); }
.b.gold { color: var(--gold); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.b.late { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); margin-left: 6px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 20px; border: 0; border-radius: 16px; color: #fff; font-weight: 700; font-size: 15.5px; background: var(--grad); box-shadow: var(--shadow-lg); transition: transform .15s, filter .15s; }
.btn:active { transform: scale(.97); filter: brightness(1.05); }
.btn:disabled { opacity: .6; }
.btn.sm { height: 44px; padding: 0 16px; font-size: 14.5px; border-radius: 13px; box-shadow: none; }
.btn.wide { width: 100%; }
.ghost { height: 44px; padding: 0 16px; border-radius: 13px; border: 0; background: var(--sunk); color: var(--text); font-size: 14px; font-weight: 600; }
.ghost.danger { color: var(--bad); margin-left: auto; }
.ghost:active { transform: scale(.97); }

/* ---- カレンダー ---- */
.calbox { padding: 16px 12px 12px; border-radius: 26px; background: var(--surface); box-shadow: var(--shadow); }
.cal-h { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 6px; }
.cal-h b { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.cal-h b span { font-size: 14px; color: var(--muted); font-weight: 600; margin-right: 6px; }
.nav2 { display: flex; gap: 6px; }
.nav2 button { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; border: 0; background: var(--sunk); color: var(--text-2); }
.nav2 button:active { transform: scale(.92); }
.nav2 svg.i { width: 18px; height: 18px; }
.cal-sum { display: flex; gap: 6px; margin: 4px 4px 12px; flex-wrap: wrap; }
.cal-sum span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px; background: var(--sunk); font-size: 12.5px; font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; }
.cal-sum span i { width: 8px; height: 8px; border-radius: 50%; }
.cal-sum span small { font-weight: 500; color: var(--muted); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
.cw { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 2px 0 6px; }
.cw.sun { color: #f43f5e; } .cw.sat { color: #3b82f6; }
.cd { position: relative; height: 54px; padding: 4px 0 0; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cd b { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-size: 15.5px; font-weight: 600; font-variant-numeric: tabular-nums; transition: background .2s, color .2s, transform .15s; }
.cd.sun b { color: #f43f5e; } .cd.sat b { color: #3b82f6; }
.cd.past b { opacity: .5; }
.cd.now b { color: var(--a); box-shadow: inset 0 0 0 2px var(--a); }
.cd.on b { color: #fff !important; opacity: 1; background: var(--grad); box-shadow: 0 6px 16px -6px rgba(91,91,246,.8); }
.cd:active b { transform: scale(.9); }
.ks { display: flex; gap: 3px; height: 6px; }
.ks em { width: 6px; height: 6px; border-radius: 50%; }
.k-appt { background: var(--k-appt) !important; } .k-view { background: var(--k-view) !important; } .k-contract { background: var(--k-contract) !important; }
.k-settle { background: var(--k-settle) !important; } .k-task { background: var(--k-task) !important; } .k-other { background: var(--k-other) !important; } .k-todo { background: var(--k-todo) !important; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; margin: 10px 0 0; font-size: 11px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 6px; height: 6px; border-radius: 50%; }

/* ---- 予定の行（時刻・色の線） ---- */
.list { border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.cr, .td { position: relative; display: flex; align-items: center; gap: 12px; padding: 13px 14px; min-height: 60px; }
.list > * + * { border-top: 1px solid var(--line); }
.when { flex: none; width: 46px; text-align: center; font-size: 13px; font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; line-height: 1.2; }
.when small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); }
.bar { flex: none; width: 4px; align-self: stretch; border-radius: 4px; }
.cr-main { flex: 1; min-width: 0; }
.cr-main .tt { display: block; font-size: 15px; font-weight: 700; line-height: 1.35; word-break: break-word; }
.cr-main .sub { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
.cr-main .sub .kind { font-weight: 700; }
.cr.st-done .tt, .cr.st-cx .tt { color: var(--muted); }
.cr.st-cx .tt { text-decoration: line-through; }
.cr.st-done .bar, .cr.st-cx .bar { opacity: .35; }
.mini-call { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: #fff; background: linear-gradient(135deg, #10b981, #06b6d4); box-shadow: 0 8px 18px -8px rgba(16,185,129,.8); }
.mini-call svg.i { width: 20px; height: 20px; }
.mini-call:active { transform: scale(.92); }

/* ToDo */
.td-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; text-align: left; border: 0; background: none; padding: 2px 0; }
.td-main .tt { font-size: 15px; font-weight: 600; line-height: 1.4; word-break: break-word; }
.td-main .sub { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 1px; }
.tm { font-variant-numeric: tabular-nums; color: var(--a); font-weight: 700; }
.ck { position: relative; flex: none; width: 28px; height: 28px; }
.ck input { position: absolute; inset: 0; opacity: 0; margin: 0; z-index: 1; }
.ck i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); transition: all .2s; }
.ck i::after { content: ""; width: 10px; height: 6px; border: 2.5px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px) scale(0); transition: transform .2s; }
.ck input:checked + i { background: var(--good); border-color: var(--good); }
.ck input:checked + i::after { transform: rotate(-45deg) translate(1px,-1px) scale(1); }

.td-add { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding: 8px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
.td-add .one { display: flex; align-items: center; gap: 8px; }
.td-add .one .plus { flex: none; display: grid; place-items: center; width: 30px; height: 30px; margin-left: 6px; border-radius: 50%; background: color-mix(in srgb, var(--a) 14%, transparent); color: var(--a); }
.td-add .one .plus svg.i { width: 18px; height: 18px; stroke-width: 2.4; }
.td-add input, .td-edit input { min-width: 0; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid transparent; background: var(--sunk); color: var(--text); font-size: 16px; outline: none; transition: border-color .15s, background .15s; }
.td-add input:focus, .td-edit input:focus { border-color: var(--a); background: var(--surface); }
.td-add .one input { flex: 1; background: transparent; padding-left: 4px; }
.td-add .one input:focus { background: transparent; border-color: transparent; }
.td-row { display: flex; gap: 8px; align-items: center; }
.td-row input[type=date] { flex: 1; } .td-row input[type=time] { width: 116px; }
.td-edit { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: color-mix(in srgb, var(--a) 6%, var(--surface)); }

.undo { position: fixed; z-index: 30; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); max-width: 608px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 16px; border-radius: 16px; background: #0f172a; color: #e2e8f0; font-size: 14px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.5); animation: rise .25s ease both; }
:root[data-theme="dark"] .undo { background: #1e2433; }
.undo button { border: 0; background: none; color: #67e8f9; font-weight: 800; }

/* ---- 今日の帯 ---- */
.hero { position: relative; overflow: hidden; padding: 20px; border-radius: 26px; color: #fff; background: var(--grad); box-shadow: var(--shadow-lg); }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(90% 120% at 100% 0%, rgba(255,255,255,.28), transparent 55%); }
.hero > * { position: relative; }
.hero .d { font-size: 13px; font-weight: 600; opacity: .85; }
.hero .big { font-size: 26px; font-weight: 800; letter-spacing: -.01em; margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stats div { padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,.16); backdrop-filter: blur(6px); }
.stats b { display: block; font-size: 24px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { font-size: 11.5px; opacity: .9; font-weight: 600; }
.hero .go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; margin-top: 14px; border: 0; border-radius: 16px; background: #fff; color: #3730a3; font-weight: 800; font-size: 15px; box-shadow: 0 10px 24px -12px rgba(0,0,0,.4); }
.hero .go:active { transform: scale(.98); }

/* ---- 顧客 ---- */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 14px; background: var(--sunk); }
.seg button { height: 36px; border: 0; border-radius: 11px; background: none; color: var(--muted); font-size: 13px; font-weight: 700; transition: all .2s; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px -2px rgba(15,23,42,.18); }
.search { position: relative; margin: 10px 0 0; }
.search svg.i { position: absolute; left: 14px; top: 13px; width: 18px; height: 18px; color: var(--muted); }
.search input { width: 100%; height: 44px; padding: 0 14px 0 40px; border-radius: 14px; border: 0; background: var(--surface); box-shadow: var(--shadow); color: var(--text); font-size: 16px; outline: none; }
.card { position: relative; margin-bottom: 12px; padding: 16px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px; border-radius: 0 4px 4px 0; background: var(--t-watch); }
.card.t-now::before { background: var(--t-now); } .card.t-today::before { background: var(--t-today); } .card.t-week::before { background: var(--t-week); }
.card.t-fresh::before { background: var(--t-fresh); } .card.t-out::before { background: var(--t-out); }
.card .top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.name { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.name small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.todo { display: flex; align-items: flex-start; gap: 10px; margin-top: 10px; padding: 11px 12px; border-radius: 14px; background: var(--sunk); }
.todo-main { flex: 1; min-width: 0; }
.act { font-weight: 700; font-size: 14.5px; }
.why { font-size: 12.5px; color: var(--muted); }
.due { flex: none; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface); color: var(--text-2); white-space: nowrap; }
.due.today { color: var(--warn); } .due.late { color: var(--bad); }
.actions { display: flex; gap: 8px; margin-top: 12px; }
.call { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border-radius: 16px; color: #fff; text-decoration: none; font-weight: 800; font-size: 15.5px; background: linear-gradient(135deg, #10b981, #06b6d4); box-shadow: 0 12px 24px -14px rgba(16,185,129,.9); }
.call span { font-size: 12.5px; font-weight: 600; opacity: .92; font-variant-numeric: tabular-nums; }
.call:active, .sms:active { transform: scale(.98); }
.sms { flex: none; display: grid; place-items: center; width: 72px; min-height: 52px; border-radius: 16px; background: var(--sunk); color: var(--text); text-decoration: none; font-weight: 700; }
.nocall { flex: 1; display: grid; place-items: center; min-height: 46px; border-radius: 14px; border: 1.5px dashed var(--line-strong); color: var(--muted); font-size: 13px; }
.run-h { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 10px; }
.run-h b { font-size: 17px; font-weight: 800; }
.prog { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; margin: 0 4px 14px; }
.prog i { display: block; height: 100%; background: var(--grad); border-radius: 3px; transition: width .3s; }
.run .card { box-shadow: var(--shadow-lg); }

/* ---- 合言葉の画面 ---- */
.center { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: calc(env(safe-area-inset-top) + 24px) 28px 40px; background: var(--band); color: #fff; }
.center .appicon { width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 24px; box-shadow: 0 24px 50px -16px rgba(18,181,214,.6), 0 0 0 1px rgba(255,255,255,.12); }
.center h1 { margin: 0 0 6px; font-size: 28px; font-weight: 800; }
.center p { color: rgba(255,255,255,.7); font-size: 14px; margin: 0 0 20px; line-height: 1.7; }
.center form { display: flex; flex-direction: column; gap: 14px; text-align: left; max-width: 380px; width: 100%; margin: 0 auto; }
.center input[type=password] { width: 100%; height: 54px; padding: 0 18px; border-radius: 16px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); color: #fff; font-size: 17px; outline: none; }
.center input[type=password]::placeholder { color: rgba(255,255,255,.45); }
.center input[type=password]:focus { border-color: #67e8f9; background: rgba(255,255,255,.12); }
.remember { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: rgba(255,255,255,.75); }
.remember input { width: 20px; height: 20px; accent-color: #22d3ee; }
.center .btn { background: linear-gradient(135deg, #6366f1, #22d3ee); }
.center .err { background: rgba(239,68,68,.18); color: #fecaca; }
.center .lnk2 { margin-top: 18px; color: rgba(255,255,255,.55); font-size: 12px; }
